<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b18" />
    <meta
      name="description"
      content="直径6cmの2.5号玉（型物）に直径1cmの星を並べて花火を設計し、そのまま打ち上げシミュレーションできるアプリ"
    />
    <title>デジタル花火 — 2.5号玉（型物）をつくって打ち上げる</title>
    <link rel="icon" href="./public/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body class="is-loading">
    <div id="app">
      <!-- ============================ ヘッダー ============================ -->
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">🎆</span>
          <span class="brand-text">デジタル花火</span>
          <span class="brand-sub">2.5号玉</span>
        </div>

        <nav class="tabs" aria-label="画面">
          <button class="tab is-active" type="button" data-screen="editor">つくる</button>
          <button class="tab" type="button" data-screen="gallery">ギャラリー</button>
        </nav>

        <div class="topbar-right">
          <button class="btn btn-ghost btn-icon-text" id="btn-undo" type="button" title="もどす (Ctrl+Z)"></button>
          <button class="btn btn-ghost btn-icon-text" id="btn-redo" type="button" title="やりなおす (Ctrl+Shift+Z)"></button>
          <button class="btn btn-ghost btn-icon-text" id="btn-new" type="button" title="あたらしく つくる"></button>
          <button class="icon-btn" id="btn-sound" type="button" title="おと"></button>
        </div>
      </header>

      <!-- ====================== 花火玉をつくる ====================== -->
      <main class="screen is-active" id="screen-editor" data-screen="editor">
        <aside class="panel panel-left" id="shell-tools"></aside>

        <section class="stage-col">
          <div class="stage-head">
            <span class="step-badge"><b>2</b><span>ならべる</span></span>
            <input
              class="scene-name"
              id="shell-name"
              type="text"
              maxlength="40"
              aria-label="はなびの なまえ"
            />
            <span class="count-badge" id="pellet-count">ほし 0 こ</span>
          </div>

          <div class="shell-wrap">
            <div class="shell-frame" id="shell-frame">
              <canvas id="shell-canvas" tabindex="0" aria-label="花火玉（直径6cm・型物）"></canvas>
              <div class="shell-hint" id="shell-hint">
                <span class="shell-hint-emoji">👆</span>
                <span>まるの なかを タップすると<br />ほしを おけるよ</span>
              </div>
              <div class="shell-scale">
                <span class="shell-scale-bar"></span>
                <span>ちょっけい 6cm の 2.5号玉（型物） ／ ほし 1こ = 1cm</span>
              </div>
            </div>
          </div>
        </section>

        <section class="actionbar" id="shell-actions"></section>
      </main>

      <!-- =========================== ギャラリー =========================== -->
      <main class="screen" id="screen-gallery" data-screen="gallery">
        <div class="gallery-head" id="gallery-head"></div>
        <div class="gallery-list" id="gallery-list"></div>
      </main>
    </div>

    <div id="player-root"></div>
    <div id="modal-root"></div>
    <div id="toast-root"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
